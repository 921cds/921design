<style>
/* Layout: Pentagram-like index — a giant statement, a discipline filter, then a two-column project grid where "large" work spans the full width. */
:root {
  --bg: #000000;
  --fg: #ffffff;
  --muted: #8a8a8a;
  --line: #262626;
  --hover: #ffffff;
  --display: "Schibsted Grotesk", "Noto Sans KR", "Helvetica Neue", Arial, sans-serif;
  --body: "Schibsted Grotesk", "Noto Sans KR", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --gutter: clamp(16px, 3vw, 40px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
img { max-width: 100%; display: block; }

.wrap {
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg);
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding-block: 18px;
}
.logo { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: -0.02em; }
.nav { display: flex; gap: clamp(14px, 3vw, 32px); font-weight: 500; font-size: 15px; }
.nav a { color: var(--muted); transition: color .15s; }
.nav a:hover, .nav a[aria-current="true"] { color: var(--fg); }

/* Statement */
.statement { padding-block: clamp(40px, 9vw, 120px) clamp(32px, 6vw, 80px); }
.statement h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(40px, 7.4vw, 118px);
  line-height: 0.98;
  letter-spacing: -0.035em;
  max-width: 15ch;
  text-wrap: balance;
}
.statement p {
  margin: clamp(20px, 3vw, 36px) 0 0;
  color: var(--muted);
  font-size: clamp(16px, 1.5vw, 20px);
  max-width: 40ch;
  word-break: keep-all;
}

/* Filter */
.filter {
  display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline;
  padding-block: 16px; border-top: 1px solid var(--line);
  font-size: 15px; font-weight: 500;
}
.filter .label { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 8px; }
.filter button { color: var(--muted); transition: color .15s; }
.filter button sup { font-family: var(--mono); font-size: 10px; margin-left: 2px; }
.filter button:hover, .filter button[aria-pressed="true"] { color: var(--fg); }

/* Grid */
.grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(40px, 5vw, 72px) var(--gutter);
  padding-block: 24px clamp(64px, 10vw, 140px);
}
.card { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card.large { grid-column: 1 / -1; }
.cover {
  position: relative; overflow: hidden;
  aspect-ratio: 4 / 3; max-width: 100%;
  background: var(--c, #222); color: var(--k, #fff);
}
.card.large .cover { aspect-ratio: 16 / 8; }
.cover img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.cover .art { position: absolute; inset: 0; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.card:hover .cover img, .card:hover .cover .art { transform: scale(1.03); }
.art .mark {
  position: absolute; left: 5%; bottom: 2%;
  font-family: var(--display); font-weight: 900;
  font-size: clamp(80px, 18vw, 300px); line-height: .8; letter-spacing: -0.05em;
  white-space: nowrap;
}
.card.large .art .mark { font-size: clamp(90px, 22vw, 380px); }
.art .corner {
  position: absolute; top: 5%; left: 5%; right: 5%;
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .75;
}
.meta h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(18px, 1.6vw, 22px); letter-spacing: -0.01em; line-height: 1.25; }
.meta p { margin: 2px 0 0; color: var(--muted); font-size: clamp(15px, 1.3vw, 18px); line-height: 1.35; word-break: keep-all; }
.empty { grid-column: 1 / -1; color: var(--muted); padding-block: 60px; }

/* About */
.about { border-top: 1px solid var(--line); padding-block: clamp(48px, 8vw, 120px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 32px var(--gutter); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.about p { margin: 0; font-size: clamp(22px, 2.6vw, 38px); line-height: 1.3; letter-spacing: -0.015em; font-weight: 500; word-break: keep-all; max-width: 30ch; }
.services { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px 28px; color: var(--muted); font-size: 16px; }

/* Contact */
.contact { border-top: 1px solid var(--line); padding-block: clamp(48px, 8vw, 120px) 32px; }
.contact .big {
  display: inline-block; margin-top: 20px;
  font-family: var(--display); font-weight: 800;
  font-size: clamp(32px, 7vw, 112px); letter-spacing: -0.035em; line-height: 1;
  overflow-wrap: anywhere;
  border-bottom: 3px solid transparent; transition: border-color .2s;
}
.contact .big:hover { border-color: var(--fg); }
.contact-grid { margin-top: clamp(40px, 6vw, 80px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px var(--gutter); font-size: 15px; }
.contact-grid div { min-width: 0; overflow-wrap: anywhere; }
.contact-grid .eyebrow { display: block; margin-bottom: 6px; }
.copy-btn { color: var(--muted); font-size: 13px; margin-left: 8px; text-decoration: underline; text-underline-offset: 3px; }

/* Project detail */
.detail {
  position: fixed; inset: 0; z-index: 40; overflow-y: auto;
  background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.detail .top { position: sticky; top: 0; }
.detail-head { padding-block: clamp(32px, 6vw, 80px) clamp(24px, 4vw, 48px); }
.detail-head h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(40px, 8vw, 128px); letter-spacing: -0.04em; line-height: .95; text-wrap: balance; }
.detail-head .sum { margin: 20px 0 0; color: var(--muted); font-size: clamp(18px, 2vw, 28px); max-width: 32ch; word-break: keep-all; line-height: 1.3; }
.detail .cover { aspect-ratio: 16 / 8; }
.detail .cover .art .mark { font-size: clamp(100px, 24vw, 420px); }
.detail-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 32px var(--gutter); padding-block: clamp(32px, 6vw, 80px); }
.facts { margin: 0; display: grid; gap: 16px; align-content: start; }
.facts dt { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-weight: 500; }
.desc { margin: 0; font-size: clamp(18px, 1.8vw, 24px); line-height: 1.55; max-width: 36em; word-break: keep-all; }
.gallery { display: grid; gap: var(--gutter); padding-bottom: clamp(32px, 6vw, 80px); }
.next { display: block; border-top: 1px solid var(--line); padding-block: 32px 64px; }
.next .eyebrow { display: block; margin-bottom: 8px; }
.next strong { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 5vw, 72px); letter-spacing: -0.03em; line-height: 1; }
.next:hover strong { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; font-size: 14px; font-weight: 500; z-index: 50; }

/* Admin */
.admin { position: fixed; inset: 0; z-index: 45; overflow-y: auto; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.admin .top { position: sticky; top: 0; border-bottom: 1px solid var(--line); }
.admin-inner { max-width: 1080px; padding-block: 32px 96px; }
.admin h1 { margin: 0 0 4px; font-family: var(--display); font-weight: 800; font-size: clamp(32px, 5vw, 56px); letter-spacing: -0.03em; }
.admin .lead { margin: 0 0 32px; color: var(--muted); }
.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin-bottom: 24px; font-weight: 500; }
.tabs button { padding-block: 10px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--fg); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border: 1px solid var(--fg); font-weight: 500; font-size: 14px; transition: background .15s, color .15s; }
.btn:hover { background: var(--fg); color: var(--bg); }
.btn.primary { background: var(--fg); color: var(--bg); }
.btn.primary:hover { background: transparent; color: var(--fg); }
.btn.danger { border-color: #ff5a4e; color: #ff5a4e; }
.btn.danger:hover { background: #ff5a4e; color: var(--bg); }
.btn:disabled { opacity: .4; pointer-events: none; }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.bar .count { color: var(--muted); font-size: 14px; }
.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--line); }
.row .thumb { width: 96px; aspect-ratio: 4 / 3; overflow: hidden; background: var(--c, #222); color: var(--k, #fff); display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 28px; letter-spacing: -0.04em; }
.row .thumb img { width: 100%; height: 100%; object-fit: cover; }
.row .info { min-width: 0; }
.row .info strong { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .info span { color: var(--muted); font-size: 13px; }
.row .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); padding: 1px 6px; margin-left: 6px; color: var(--muted); }
.row .acts { display: flex; gap: 4px; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.icon-btn:hover { color: var(--fg); border-color: var(--fg); }
.icon-btn:disabled { opacity: .3; pointer-events: none; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px var(--gutter); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label, .field .lbl { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field input[type="text"], .field input[type="number"], .field input[type="email"], .field input[type="url"], .field textarea, .field select {
  width: 100%; background: transparent; color: var(--fg); border: 0; border-bottom: 1px solid var(--line);
  padding: 8px 0; font: inherit; font-size: 17px; border-radius: 0;
}
.field textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
.field select option { background: var(--bg); }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--fg); }
.field .hint { color: var(--muted); font-size: 13px; }
.colors { display: flex; gap: 16px; flex-wrap: wrap; }
.colors label { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-family: var(--body); font-size: 14px; color: var(--fg); }
.colors input[type="color"] { width: 40px; height: 32px; border: 1px solid var(--line); background: none; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); padding: 6px 12px; font-size: 14px; cursor: pointer; text-transform: none; letter-spacing: 0; font-family: var(--body); color: var(--fg); }
.chips input { accent-color: #fff; }
.drop { border: 1px dashed var(--muted); padding: 20px; text-align: center; color: var(--muted); font-size: 14px; cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--fg); color: var(--fg); }
.drop input { display: none; }
.preview-cover { width: 100%; max-width: 420px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; }
.thumbs figure { margin: 0; position: relative; aspect-ratio: 4 / 3; background: #111; overflow: hidden; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.thumbs button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; background: var(--bg); border: 1px solid var(--line); font-size: 12px; }
.thumbs .order { position: absolute; bottom: 4px; left: 4px; display: flex; gap: 4px; }
.thumbs .order button { position: static; }
.form-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; padding-top: 16px; border-top: 1px solid var(--line); }
.form-actions div { display: flex; gap: 12px; flex-wrap: wrap; }
.notice { border: 1px solid var(--line); padding: 16px; color: var(--muted); font-size: 14px; margin-bottom: 24px; }
.uploading { font-family: var(--mono); font-size: 12px; color: var(--muted); }

@media (max-width: 760px) {
  .form { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: 64px minmax(0, 1fr); }
  .row .thumb { width: 64px; font-size: 20px; }
  .row .acts { grid-column: 1 / -1; justify-content: flex-end; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .card.large .cover { aspect-ratio: 4 / 3; }
  .about, .detail-body { grid-template-columns: minmax(0, 1fr); }
  .services { grid-column: 1; }
  .contact-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .nav { gap: 14px; font-size: 14px; }
}
</style>
</head>

</main>

<article class="detail" id="detail" hidden aria-modal="true" role="dialog" aria-labelledby="d-title"></article>
<section class="admin" id="admin" hidden aria-label="포트폴리오 관리">

    <nav class="nav"><a href="#work">← 사이트로 돌아가기</a></nav>
  </header>
  <div class="admin-inner wrap" id="admin-body"></div>
</section>
<div class="toast" id="toast" hidden></div>

</script>
<script>
(function () {
  "use strict";
  // Portfolio data: the artifact's shared store (db) when available, otherwise data/projects.json.
  // Images are either a path ("images/x.jpg") or an uploaded asset id (32 hex chars).
  var DATA_URL = "data/projects.json";
  var state = {
    site: {}, projects: [], filter: "All", source: "none",
    db: null, assets: null, downloads: null, canEdit: false, userKnown: false,
    jsonData: null, tab: "projects", editing: null, confirmDelete: null, busy: false
  };
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function isAssetId(v) { return typeof v === "string" && /^[0-9a-f]{32}$/.test(v); }
  function imgSrc(v) { return isAssetId(v) ? "/_blob/" + v : v; }
  function clone(o) { return JSON.parse(JSON.stringify(o || {})); }
  function publicProjects() { return state.projects.filter(function (p) { return p && p.slug && !p.hidden; }); }
  function slugify(s) {
    return String(s || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "project-" + Date.now().toString(36);
  }

  function coverHTML(p) {
    var style = "--c:" + esc(p.color || "#222") + ";--k:" + esc(p.ink || "#fff");
    if (p.cover) {
      return '<div class="cover" style="' + style + '"><img src="' + esc(imgSrc(p.cover)) + '" alt="' + esc(p.title) + '" loading="lazy"></div>';
    }
    return '<div class="cover" style="' + style + '"><div class="art" aria-hidden="true">' +
      '<div class="corner"><span>' + esc((p.disciplines || []).join(" / ")) + '</span><span>' + esc(p.year) + '</span></div>' +
      '<div class="mark">' + esc(p.mark || (p.title || "").slice(0, 2)) + '</div></div></div>';
  }

  /* ---------- Public site ---------- */

  function renderSite() {
    var s = state.site;
    document.title = s.name || document.title;
    $("logo").textContent = s.name || "Studio";
    $("admin-logo").textContent = s.name || "Studio";
    if (s.tagline) $("tagline").textContent = s.tagline;
    $("tagline-ko").textContent = s.taglineKo || "";
    $("about-text").textContent = s.about || "";
    $("services").innerHTML = (s.disciplines || []).map(function (d) { return "<span>" + esc(d) + "</span>"; }).join("");
    $("email-big").textContent = s.email || "";
    $("email-big").href = s.email ? "mailto:" + s.email : "#contact";
    $("email").textContent = s.email || "";
    $("phone").textContent = s.phone || "";
    $("address").textContent = s.address || "";
    $("instagram").parentNode.hidden = !s.instagram;
    if (s.instagram) $("instagram").href = s.instagram;
    $("copyright").textContent = "© " + new Date().getFullYear() + " " + (s.name || "");
  }

  function disciplines(list) {
    var out = (state.site.disciplines || []).slice();
    (list || state.projects).forEach(function (p) {
      (p.disciplines || []).forEach(function (d) { if (out.indexOf(d) < 0) out.push(d); });
    });
    return out;
  }

  function renderFilter() {
    var items = publicProjects();
    if (state.filter !== "All" && !items.some(function (p) { return (p.disciplines || []).indexOf(state.filter) >= 0; })) state.filter = "All";
    $("filter").innerHTML = '<span class="label">Filter</span>' + ["All"].concat(disciplines(items)).map(function (d) {
      var n = d === "All" ? items.length : items.filter(function (p) { return (p.disciplines || []).indexOf(d) >= 0; }).length;
      if (!n && d !== "All") return "";
      return '<button type="button" data-d="' + esc(d) + '" aria-pressed="' + (state.filter === d) + '">' + esc(d) + "<sup>" + n + "</sup></button>";
    }).join("");
  }

  function renderGrid() {
    var items = publicProjects().filter(function (p) {
      return state.filter === "All" || (p.disciplines || []).indexOf(state.filter) >= 0;
    });
    if (!items.length) { $("grid").innerHTML = '<p class="empty">아직 공개된 프로젝트가 없습니다.</p>'; return; }
    $("grid").innerHTML = items.map(function (p) {
      // "large" spans the full row only in the unfiltered view, so filtered grids stay even.
      var large = p.size === "large" && state.filter === "All";
      return '<a class="card' + (large ? " large" : "") + '" href="#' + esc(p.slug) + '">' + coverHTML(p) +
        '<div class="meta"><h2>' + esc(p.title) + '</h2><p>' + esc(p.summary) + "</p></div></a>";
    }).join("");
  }

  function renderPublic() { renderSite(); renderFilter(); renderGrid(); }

  function openDetail(slug) {
    var list = publicProjects();
    var i = list.findIndex(function (p) { return p.slug === slug; });
    var d = $("detail");
    if (i < 0) { d.hidden = true; return false; }
    var p = list[i], next = list[(i + 1) % list.length];
    var imgs = (p.images || []).map(function (src) {
      return '<img src="' + esc(imgSrc(src)) + '" alt="' + esc(p.title) + '" loading="lazy">';
    }).join("");
    d.innerHTML =
      '<header class="top wrap"><a class="logo" href="#work">' + esc(state.site.name || "Studio") + '</a>' +
      '<nav class="nav"><a href="#work">← 전체 작업</a></nav></header>' +
      '<div class="detail-head wrap"><h1 id="d-title">' + esc(p.title) + '</h1><p class="sum">' + esc(p.summary) + "</p></div>" +
      '<div class="wrap">' + coverHTML(p) + "</div>" +
      '<div class="detail-body wrap"><dl class="facts">' +
        "<div><dt>Client</dt><dd>" + esc(p.client) + "</dd></div>" +
        "<div><dt>Year</dt><dd>" + esc(p.year) + "</dd></div>" +
        "<div><dt>Disciplines</dt><dd>" + esc((p.disciplines || []).join(", ")) + "</dd></div>" +
      '</dl><p class="desc">' + esc(p.description) + "</p></div>" +
      (imgs ? '<div class="gallery wrap">' + imgs + "</div>" : "") +
      (next && next !== p ? '<a class="next wrap" href="#' + esc(next.slug) + '"><span class="eyebrow">Next project</span><strong>' + esc(next.title) + "</strong></a>" : "");
    d.hidden = false;
    d.scrollTop = 0;
    return true;
  }

  function route() {
    var slug = decodeURIComponent((location.hash || "").slice(1));
    var adminOpen = slug === "admin";
    $("admin").hidden = !adminOpen;
    if (adminOpen) { $("detail").hidden = true; renderAdmin(); }
    var detailOpen = !adminOpen && openDetail(slug);
    document.body.style.overflow = adminOpen || detailOpen ? "hidden" : "";
    if (!adminOpen && !detailOpen && slug && slug !== "top") {
      var el = document.getElementById(slug);
      if (el) el.scrollIntoView();
    }
  }

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 2200);
  }

  /* ---------- Admin ---------- */

  function sorted() {
    return state.projects.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  }

  function renderAdmin() {
    if ($("admin").hidden) return;
    var body = $("admin-body");
    var head = '<h1>포트폴리오 관리</h1><p class="lead">여기서 바꾼 내용은 저장 즉시 사이트에 반영됩니다.</p>';
    if (!state.userKnown) { body.innerHTML = head + '<p class="notice">권한을 확인하는 중입니다.</p>'; return; }
    if (!state.canEdit) {
      body.innerHTML = head + '<p class="notice">편집 권한이 있는 사람만 포트폴리오를 관리할 수 있습니다.</p>';
      return;
    }
    if (!state.db) {
      body.innerHTML = head + '<p class="notice">이 화면에서는 저장소에 연결할 수 없습니다. 이 사이트 파일을 직접 호스팅하는 경우 data/projects.json을 고쳐 주세요.</p>';
      return;
    }
    if (state.editing) { body.innerHTML = head + editFormHTML(); bindForm(); return; }
    var tabs = [["projects", "프로젝트"], ["site", "스튜디오 정보"], ["backup", "백업"]];
    body.innerHTML = head + '<div class="tabs" role="tablist">' + tabs.map(function (t) {
      return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (state.tab === t[0]) + '">' + t[1] + "</button>";
    }).join("") + "</div>" + (state.tab === "site" ? siteFormHTML() : state.tab === "backup" ? backupHTML() : listHTML());
  }

  function listHTML() {
    var list = sorted();
    var importBox = state.source !== "db" && state.jsonData && (state.jsonData.projects || []).length
      ? '<div class="notice">저장소가 비어 있습니다. 지금 사이트에 보이는 예시 프로젝트 ' + state.jsonData.projects.length +
        '개로 시작하거나, 새 프로젝트를 바로 추가하세요. <button class="btn" type="button" data-act="import" style="margin-left:8px">예시로 시작</button></div>'
      : "";
    var rows = list.map(function (p, i) {
      var thumb = p.cover ? '<img src="' + esc(imgSrc(p.cover)) + '" alt="">' : esc(p.mark || (p.title || "").slice(0, 2));
      var confirming = state.confirmDelete === p.id;
      return '<li class="row"><div class="thumb" style="--c:' + esc(p.color || "#222") + ";--k:" + esc(p.ink || "#fff") + '">' + thumb + "</div>" +
        '<div class="info"><strong>' + esc(p.title || "제목 없음") + "</strong><span>" + esc(p.client || "") + (p.year ? " · " + esc(p.year) : "") + "</span>" +
          (p.hidden ? '<span class="tag">숨김</span>' : "") + (p.size === "large" ? '<span class="tag">크게</span>' : "") + "</div>" +
        '<div class="acts">' +
          (confirming
            ? '<button class="btn danger" type="button" data-act="delete-yes" data-id="' + esc(p.id) + '">삭제 확인</button><button class="btn" type="button" data-act="delete-no">취소</button>'
            : '<button class="icon-btn" type="button" title="위로" aria-label="위로" data-act="up" data-id="' + esc(p.id) + '"' + (i === 0 ? " disabled" : "") + ">↑</button>" +
              '<button class="icon-btn" type="button" title="아래로" aria-label="아래로" data-act="down" data-id="' + esc(p.id) + '"' + (i === list.length - 1 ? " disabled" : "") + ">↓</button>" +
              '<button class="icon-btn" type="button" title="' + (p.hidden ? "공개하기" : "숨기기") + '" aria-label="' + (p.hidden ? "공개하기" : "숨기기") + '" data-act="toggle" data-id="' + esc(p.id) + '">' + (p.hidden ? "◌" : "●") + "</button>" +
              '<button class="icon-btn" type="button" title="수정" aria-label="수정" data-act="edit" data-id="' + esc(p.id) + '">✎</button>' +
              '<button class="icon-btn" type="button" title="삭제" aria-label="삭제" data-act="delete" data-id="' + esc(p.id) + '">✕</button>') +
        "</div></li>";
    }).join("");
    return importBox + '<div class="bar"><span class="count">프로젝트 ' + list.length + "개 · 공개 " + publicProjects().length + "개</span>" +
      '<button class="btn primary" type="button" data-act="new">+ 새 프로젝트</button></div>' +
      (list.length ? '<ul class="rows">' + rows + "</ul>" : '<p class="notice">아직 프로젝트가 없습니다. 오른쪽 위 "새 프로젝트"로 첫 작업을 올려 보세요.</p>');
  }

  function field(id, label, value, opts) {
    opts = opts || {};
    var input = opts.textarea
      ? '<textarea id="' + id + '">' + esc(value) + "</textarea>"
      : '<input id="' + id + '" type="' + (opts.type || "text") + '" value="' + esc(value) + '"' + (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : "") + ">";
    return '<div class="field' + (opts.full ? " full" : "") + '"><label for="' + id + '">' + label + "</label>" + input +
      (opts.hint ? '<span class="hint">' + opts.hint + "</span>" : "") + "</div>";
  }

  function editFormHTML() {
    var e = state.editing, p = e.data;
    var all = disciplines();
    (p.disciplines || []).forEach(function (d) { if (all.indexOf(d) < 0) all.push(d); });
    return '<div class="bar"><span class="count">' + (e.isNew ? "새 프로젝트" : "프로젝트 수정") + "</span></div>" +
      '<form class="form" id="pform" novalidate>' +
      field("f-title", "제목 *", p.title, { placeholder: "Seoul Modern Archive" }) +
      field("f-client", "클라이언트", p.client) +
      field("f-year", "연도", p.year, { type: "number" }) +
      '<div class="field"><label for="f-size">목록 크기</label><select id="f-size">' +
        '<option value="normal"' + (p.size !== "large" ? " selected" : "") + '>보통 (2열 중 한 칸)</option>' +
        '<option value="large"' + (p.size === "large" ? " selected" : "") + ">크게 (전체 폭)</option></select></div>" +
      field("f-summary", "한 줄 설명", p.summary, { full: true, hint: "목록에서 제목 아래에 보입니다." }) +
      field("f-description", "본문", p.description, { full: true, textarea: true, hint: "상세 페이지에 보입니다." }) +
      '<div class="field full"><span class="lbl">분야</span><div class="chips" id="f-disc">' + all.map(function (d) {
        return '<label><input type="checkbox" value="' + esc(d) + '"' + ((p.disciplines || []).indexOf(d) >= 0 ? " checked" : "") + ">" + esc(d) + "</label>";
      }).join("") + '</div><input id="f-disc-new" type="text" placeholder="새 분야 추가 (쉼표로 여러 개)"></div>' +
      '<div class="field full"><span class="lbl">대표 이미지</span><div id="f-cover"></div></div>' +
      '<div class="field full"><span class="lbl">상세 이미지</span><div id="f-images"></div></div>' +
      '<div class="field"><span class="lbl">이미지가 없을 때 커버</span><div class="colors">' +
        '<label><input type="color" id="f-color" value="' + esc(p.color || "#222222") + '">배경색</label>' +
        '<label><input type="color" id="f-ink" value="' + esc(p.ink || "#ffffff") + '">글자색</label></div></div>' +
      field("f-mark", "커버 글자", p.mark, { hint: "1~3자 정도가 좋아요. 비우면 제목 앞 두 글자." }) +
      field("f-slug", "주소", p.slug, { hint: "영문 소문자와 하이픈. 비우면 제목으로 자동 생성됩니다." }) +
      '<div class="field"><span class="lbl">공개</span><div class="chips"><label><input type="checkbox" id="f-hidden"' + (p.hidden ? " checked" : "") + ">사이트에서 숨기기</label></div></div>" +
      '<div class="form-actions"><div><button class="btn" type="button" data-act="cancel">취소</button></div>' +
        '<div><button class="btn primary" type="submit" id="f-save">저장</button></div></div>' +
      "</form>";
  }

  function uploadBox(id, multiple) {
    if (!state.assets) return '<p class="hint">이 화면에서는 이미지를 올릴 수 없습니다. 편집 권한으로 열었는지 확인해 주세요.</p>';
    return '<label class="drop" id="' + id + '-drop">' + (multiple ? "이미지를 끌어다 놓거나 눌러서 여러 장 선택" : "이미지를 끌어다 놓거나 눌러서 선택") +
      ' (JPG, PNG, WEBP, GIF · 최대 20MB)<input type="file" id="' + id + '" accept="image/jpeg,image/png,image/webp,image/gif"' + (multiple ? " multiple" : "") + "></label>" +
      '<p class="uploading" id="' + id + '-status"></p>';
  }

  function renderMedia() {
    var p = state.editing.data;
    $("f-cover").innerHTML = (p.cover
      ? '<div class="thumbs"><figure><img src="' + esc(imgSrc(p.cover)) + '" alt="대표 이미지"><button type="button" data-act="rm-cover" aria-label="대표 이미지 빼기">✕</button></figure></div>'
      : "") + uploadBox("up-cover", false);
    var imgs = p.images || [];
    $("f-images").innerHTML = (imgs.length ? '<div class="thumbs">' + imgs.map(function (src, i) {
      return '<figure><img src="' + esc(imgSrc(src)) + '" alt="상세 이미지 ' + (i + 1) + '"><button type="button" data-act="rm-img" data-i="' + i + '" aria-label="이미지 빼기">✕</button>' +
        '<span class="order"><button type="button" data-act="img-left" data-i="' + i + '" aria-label="앞으로"' + (i === 0 ? " disabled" : "") + '>←</button>' +
        '<button type="button" data-act="img-right" data-i="' + i + '" aria-label="뒤로"' + (i === imgs.length - 1 ? " disabled" : "") + ">→</button></span></figure>";
    }).join("") + "</div>" : "") + uploadBox("up-images", true);
    bindUpload("up-cover", false);
    bindUpload("up-images", true);
  }

  function bindUpload(id, multiple) {
    var input = $(id), drop = $(id + "-drop");
    if (!input) return;
    input.addEventListener("change", function () { handleFiles(input.files, multiple, id); });
    drop.addEventListener("dragover", function (ev) { ev.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
    drop.addEventListener("drop", function (ev) { ev.preventDefault(); drop.classList.remove("over"); handleFiles(ev.dataTransfer.files, multiple, id); });
  }

  async function handleFiles(fileList, multiple, id) {
    var files = Array.prototype.slice.call(fileList || []).filter(function (f) { return /^image\/(jpeg|png|webp|gif)$/.test(f.type); });
    if (!files.length) { toast("JPG, PNG, WEBP, GIF 이미지만 올릴 수 있습니다."); return; }
    if (!multiple) files = files.slice(0, 1);
    var status = $(id + "-status"), done = 0;
    state.busy = true; $("f-save").disabled = true;
    for (var i = 0; i < files.length; i++) {
      if (status) status.textContent = "올리는 중 " + (done + 1) + " / " + files.length;
      try {
        var res = await state.assets.upload(files[i]);
        var p = state.editing && state.editing.data;
        if (!p) break;
        if (multiple) { p.images = (p.images || []).concat(res.id); }
        else { if (p.cover && isAssetId(p.cover)) state.editing.removed.push(p.cover); p.cover = res.id; }
        state.editing.added.push(res.id);
        done++;
      } catch (err) {
        var code = err && err.code;
        toast(code === "too_large" ? files[i].name + ": 20MB보다 큰 파일은 올릴 수 없습니다."
          : code === "quota_or_state" ? "저장 공간이 가득 찼습니다. 쓰지 않는 프로젝트 이미지를 지워 주세요."
          : code === "rate_limited" ? "잠시 뒤 다시 올려 주세요."
          : files[i].name + "을(를) 올리지 못했습니다.");
      }
    }
    state.busy = false;
    if (state.editing) { renderMedia(); $("f-save").disabled = false; }
    if (done) toast("이미지 " + done + "장을 올렸습니다. 저장을 눌러야 반영됩니다.");
  }

  function bindForm() {
    renderMedia();
    $("pform").addEventListener("submit", function (ev) { ev.preventDefault(); saveProject(); });
  }

  function readForm() {
    var p = state.editing.data;
    p.title = $("f-title").value.trim();
    p.client = $("f-client").value.trim();
    p.year = $("f-year").value ? Number($("f-year").value) : "";
    p.size = $("f-size").value;
    p.summary = $("f-summary").value.trim();
    p.description = $("f-description").value.trim();
    var disc = Array.prototype.map.call(document.querySelectorAll("#f-disc input:checked"), function (i) { return i.value; });
    $("f-disc-new").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (d) { if (disc.indexOf(d) < 0) disc.push(d); });
    p.disciplines = disc;
    p.color = $("f-color").value;
    p.ink = $("f-ink").value;
    p.mark = $("f-mark").value.trim();
    p.hidden = $("f-hidden").checked;
    var slug = slugify($("f-slug").value || p.title);
    var taken = state.projects.some(function (o) { return o.id !== state.editing.id && o.slug === slug; });
    p.slug = taken ? slug + "-" + Date.now().toString(36).slice(-4) : slug;
    return p;
  }

  async function saveProject() {
    if (state.busy) return;
    var p = readForm();
    if (!p.title) { toast("제목을 입력해 주세요."); $("f-title").focus(); return; }
    var e = state.editing, body = clone(p);
    delete body.id;
    $("f-save").disabled = true;
    try {
      await state.db.collection("projects").doc(e.id).set(body);
    } catch (err) {
      $("f-save").disabled = false;
      toast(err && err.code === "quota_exceeded" ? "저장 공간이 가득 차 저장하지 못했습니다." : "저장하지 못했습니다. 다시 시도해 주세요.");
      return;
    }
    // Uploads replaced or removed in this edit are no longer referenced anywhere.
    var keep = [p.cover].concat(p.images || []);
    await deleteAssets(e.removed.filter(function (id) { return keep.indexOf(id) < 0; }));
    state.editing = null;
    toast("저장했습니다.");
    renderAdmin();
  }

  async function deleteAssets(ids) {
    if (!state.assets) return;
    for (var i = 0; i < ids.length; i++) {
      if (!isAssetId(ids[i])) continue;
      try { await state.assets.delete(ids[i]); } catch (err) { /* an unreferenced leftover is harmless */ }
    }
  }

  function startEdit(id) {
    var p = id ? state.projects.find(function (o) { return o.id === id; }) : null;
    var minOrder = state.projects.reduce(function (m, o) { return Math.min(m, o.order || 0); }, 0);
    state.editing = {
      id: p ? p.id : state.db.collection("projects").doc().id,
      isNew: !p,
      data: p ? clone(p) : { title: "", year: new Date().getFullYear(), size: "normal", color: "#222222", ink: "#ffffff", disciplines: [], images: [], order: minOrder - 1 },
      added: [], removed: []
    };
    state.confirmDelete = null;
    renderAdmin();
    $("admin").scrollTop = 0;
  }

  async function cancelEdit() {
    var e = state.editing;
    state.editing = null;
    // Discard uploads made in this edit that were never saved.
    if (e) await deleteAssets(e.added);
    renderAdmin();
  }

  async function move(id, dir) {
    var list = sorted(), i = list.findIndex(function (p) { return p.id === id; }), j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    // Rewrite every order as its index so equal or missing values can't stall a move.
    var swapped = list.slice(); swapped[i] = list[j]; swapped[j] = list[i];
    try {
      for (var k = 0; k < swapped.length; k++) {
        if (swapped[k].order !== k) await state.db.collection("projects").doc(swapped[k].id).update({ order: k });
      }
    } catch (err) { toast("순서를 바꾸지 못했습니다."); }
  }

  async function removeProject(id) {
    var p = state.projects.find(function (o) { return o.id === id; });
    state.confirmDelete = null;
    if (!p) return;
    try { await state.db.collection("projects").doc(id).delete(); }
    catch (err) { toast("삭제하지 못했습니다."); return; }
    await deleteAssets([p.cover].concat(p.images || []));
    toast("“" + (p.title || "프로젝트") + "”를 삭제했습니다.");
  }

  async function importExamples() {
    var list = (state.jsonData && state.jsonData.projects) || [];
    try {
      if (state.jsonData.site) await state.db.doc("site/info").set(state.jsonData.site);
      for (var i = 0; i < list.length; i++) {
        var body = clone(list[i]); body.order = i;
        await state.db.collection("projects").doc(slugify(body.slug || body.title)).set(body);
      }
      toast("예시 프로젝트 " + list.length + "개를 불러왔습니다.");
    } catch (err) { toast("불러오지 못했습니다. 다시 시도해 주세요."); }
  }

  function siteFormHTML() {
    var s = state.site;
    return '<form class="form" id="sform" novalidate>' +
      field("s-name", "스튜디오 이름", s.name) +
      field("s-email", "이메일", s.email, { type: "email" }) +
      field("s-tagline", "대표 문장 (영문)", s.tagline, { full: true, hint: "첫 화면에 크게 보이는 문장입니다." }) +
      field("s-taglineKo", "대표 문장 (한글)", s.taglineKo, { full: true }) +
      field("s-about", "소개", s.about, { full: true, textarea: true }) +
      field("s-phone", "전화", s.phone) +
      field("s-instagram", "인스타그램 주소", s.instagram, { type: "url" }) +
      field("s-address", "주소", s.address, { full: true }) +
      field("s-disciplines", "분야", (s.disciplines || []).join(", "), { full: true, hint: "쉼표로 구분합니다. 필터와 소개 아래 목록에 쓰입니다." }) +
      '<div class="form-actions"><div></div><div><button class="btn primary" type="submit">저장</button></div></div></form>';
  }

  async function saveSite() {
    var s = clone(state.site);
    ["name", "email", "tagline", "taglineKo", "about", "phone", "instagram", "address"].forEach(function (k) { s[k] = $("s-" + k).value.trim(); });
    s.disciplines = $("s-disciplines").value.split(",").map(function (x) { return x.trim(); }).filter(Boolean);
    try { await state.db.doc("site/info").set(s); toast("스튜디오 정보를 저장했습니다."); }
    catch (err) { toast("저장하지 못했습니다. 다시 시도해 주세요."); }
  }

  function exportJSON() {
    var projects = sorted().map(function (p) { var o = clone(p); delete o.id; delete o.order; return o; });
    return JSON.stringify({ site: state.site, projects: projects }, null, 2);
  }

  function backupHTML() {
    return '<p class="lead">지금 사이트의 모든 내용을 projects.json 형식으로 받아 둘 수 있습니다. 나중에 직접 호스팅으로 옮길 때 이 파일을 data/projects.json으로 쓰면 됩니다. 올린 이미지는 파일 안에 주소로만 들어 있으니 따로 옮겨야 합니다.</p>' +
      '<div class="bar"><span class="count">프로젝트 ' + state.projects.length + "개</span><div style=\"display:flex;gap:12px;flex-wrap:wrap\">" +
      (state.downloads ? '<button class="btn primary" type="button" data-act="download">JSON 내려받기</button>' : "") +
      '<button class="btn" type="button" data-act="copy-json">JSON 복사</button></div></div>' +
      '<div class="field full"><textarea id="json-out" readonly style="min-height:320px;font-family:var(--mono);font-size:12px">' + esc(exportJSON()) + "</textarea></div>";
  }

  $("admin-body").addEventListener("click", async function (ev) {
    var t = ev.target.closest("[data-act],[data-tab]");
    if (!t) return;
    if (t.dataset.tab) { state.tab = t.dataset.tab; state.confirmDelete = null; renderAdmin(); return; }
    var act = t.dataset.act, id = t.dataset.id, p = state.editing && state.editing.data;
    if (act === "new") startEdit(null);
    else if (act === "edit") startEdit(id);
    else if (act === "cancel") cancelEdit();
    else if (act === "up") move(id, -1);
    else if (act === "down") move(id, 1);
    else if (act === "toggle") {
      var cur = state.projects.find(function (o) { return o.id === id; });
      if (cur) state.db.collection("projects").doc(id).update({ hidden: !cur.hidden }).catch(function () { toast("바꾸지 못했습니다."); });
    }
    else if (act === "delete") { state.confirmDelete = id; renderAdmin(); }
    else if (act === "delete-no") { state.confirmDelete = null; renderAdmin(); }
    else if (act === "delete-yes") removeProject(id);
    else if (act === "import") { t.disabled = true; importExamples(); }
    else if (act === "rm-cover" && p) { if (isAssetId(p.cover)) state.editing.removed.push(p.cover); p.cover = ""; renderMedia(); }
    else if (act === "rm-img" && p) { var gone = p.images.splice(Number(t.dataset.i), 1)[0]; if (isAssetId(gone)) state.editing.removed.push(gone); renderMedia(); }
    else if ((act === "img-left" || act === "img-right") && p) {
      var i = Number(t.dataset.i), j = act === "img-left" ? i - 1 : i + 1, tmp = p.images[i];
      p.images[i] = p.images[j]; p.images[j] = tmp; renderMedia();
    }
    else if (act === "download") {
      try { await state.downloads.save({ filename: "projects.json", data: exportJSON() }); }
      catch (err) { toast("내려받지 못했습니다. JSON 복사를 이용해 주세요."); }
    }
    else if (act === "copy-json") {
      var text = exportJSON();
      try { await navigator.clipboard.writeText(text); toast("JSON을 복사했습니다."); }
      catch (err) { $("json-out").select(); toast("내용을 선택했습니다. 복사해 주세요."); }
    }
  });
  $("admin-body").addEventListener("submit", function (ev) {
    if (ev.target.id === "sform") { ev.preventDefault(); saveSite(); }
  });

  /* ---------- Shared bits ---------- */

  $("filter").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-d]");
    if (!b) return;
    state.filter = b.getAttribute("data-d");
    renderFilter(); renderGrid();
  });

  $("copy-email").addEventListener("click", function () {
    var email = state.site.email || "";
    var fallback = function () {
      var r = document.createRange(); r.selectNodeContents($("email"));
      var s = getSelection(); s.removeAllRanges(); s.addRange(r);
      toast("주소를 선택했습니다. 복사해 주세요.");
    };
    try { navigator.clipboard.writeText(email).then(function () { toast("이메일 주소를 복사했습니다."); }, fallback); }
    catch (err) { fallback(); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("detail").hidden) location.hash = "work";
  });
  window.addEventListener("hashchange", route);

  function refresh() {
    renderPublic();
    if (!$("detail").hidden) openDetail(decodeURIComponent(location.hash.slice(1)));
    if (!state.editing) renderAdmin();
  }

  // 1) Render from the JSON file right away.
  // Opened straight from disk (file://), browsers block the fetch, so fall back to the copy embedded in #site-data.
  function useJSON(data) {
    state.jsonData = data;
    if (state.source === "db") return;
    state.source = "json";
    if (!state.siteFromDb) state.site = data.site || {};
    state.projects = (data.projects || []).map(function (p, i) { var o = clone(p); o.id = o.slug; o.order = i; return o; });
    refresh(); route();
  }
  fetch(DATA_URL, { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(useJSON)
    .catch(function () {
      var el = $("site-data");
      try { if (el) { useJSON(JSON.parse(el.textContent)); return; } } catch (err) { /* fall through */ }
      if (state.source === "none") $("grid").innerHTML = '<p class="empty">프로젝트 목록을 불러오지 못했습니다.</p>';
    });

  // 2) Switch to the shared store when this view has one; it wins once it holds anything.
  if (window.claude && claude.use) {
    claude.use("db").then(function (db) {
      if (!db) return;
      state.db = db;
      db.collection("projects").onSnapshot(function (snap) {
        if (snap.empty && state.source !== "db") { if (!state.editing) renderAdmin(); return; }
        state.source = "db";
        state.projects = snap.docs.map(function (d) { var o = clone(d.data()); o.id = d.id; return o; });
        refresh();
      }, function () {});
      db.doc("site/info").onSnapshot(function (snap) {
        if (!snap.exists) return;
        state.site = clone(snap.data());
        state.siteFromDb = true;
        refresh();
      }, function () {});
      renderAdmin();
    });
    claude.use("user").then(async function (user) {
      state.canEdit = user ? await user.canEdit() : false;
      state.userKnown = true;
      $("admin-link").hidden = !state.canEdit;
      renderAdmin();
    });
    claude.use("assets").then(function (a) { state.assets = a; if (state.editing) renderMedia(); });
    claude.use("downloads").then(function (d) { state.downloads = d; });
  } else {
    state.userKnown = true;
  }
  route();
})();
</script>
</body>
</html>
